name: Update gh-pages branch

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  update-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.25

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev libmagick++-dev libcurl4-openssl-dev libssl-dev libxml2-dev libimage-exiftool-perl

      - name: Install R dependencies
        run: |
          Rscript -e "
            pkgs <- c('knitr', 'rmarkdown', 'quarto', 'magick', 'exifr', 'glue', 'lubridate', 'stringr', 'cli', 'fs', 'yesno', 'rstudioapi')
            install.packages(pkgs, repos = 'https://cran.r-project.org', dependencies = TRUE)
            missing <- pkgs[!sapply(pkgs, requireNamespace, quietly = TRUE)]
            if (length(missing) > 0) stop(paste('Failed to install packages:', paste(missing, collapse = ', ')))
            message('All packages installed successfully')
          "

      - name: Render site
        run: quarto render

      - name: Ensure .nojekyll exists
        run: |
          touch docs/.nojekyll
          echo "Created .nojekyll file in docs directory"

      - name: Checkout gh-pages
        run: |
          git fetch origin gh-pages:gh-pages
          git checkout gh-pages

      - name: Update gh-pages with rendered content
        run: |
          # Remove all files except .git
          find . -not -path './.git*' -not -path './docs*' -delete
          # Copy rendered content
          cp -r ../docs/* .
          # Ensure .nojekyll exists
          touch .nojekyll

      - name: Commit and push to gh-pages
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git diff --staged --quiet || git commit -m "Update site from main branch [skip ci]"
          git push origin gh-pages